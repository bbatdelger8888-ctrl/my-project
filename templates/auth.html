{% extends "base.html" %}
{% block content %}
<h1>{{ t(mode) }}</h1>
<form method="post" class="stack">
  {% if mode == 'register' %}<label>{{ t('full_name') }} <input name="full_name" required></label>{% endif %}
  <label>{{ t('email') }} <input type="email" name="email" required></label>
  <label>{{ t('password') }} <input type="password" name="password" required minlength="6"></label>
  <button>{{ t(mode) }}</button>
</form>
{% endblock %}
